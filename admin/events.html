<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Events — The Ritual Co. (Admin)</title>
    <meta name="robots" content="noindex, nofollow"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f2ee;color:#3a3330;min-height:100vh;font-size:14px;}
        #lock{position:fixed;inset:0;background:#f5f2ee;display:flex;align-items:center;justify-content:center;z-index:100;}
        .lock-card{background:#fff;border:0.5px solid #e0dbd4;border-radius:12px;padding:40px;width:320px;text-align:center;}
        .lock-wordmark{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a09890;margin-bottom:20px;}
        .lock-title{font-size:20px;font-weight:400;margin-bottom:20px;color:#1a1714;}
        .lock-input{width:100%;padding:10px 12px;border:0.5px solid #d0cbc4;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px;background:#faf8f5;}
        .lock-btn{width:100%;padding:11px;background:#3a3330;color:#fff;border:none;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;}
        .lock-err{font-size:12px;color:#c0392b;margin-top:8px;display:none;}
        #app{display:none;}
        .topbar{background:#fff;border-bottom:0.5px solid #e0dbd4;padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;}
        .topbar-left{display:flex;align-items:center;gap:20px;}
        .topbar-brand{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a09890;}
        .topbar-title{font-size:14px;font-weight:500;color:#1a1714;}
        .topbar a,.logout-btn{font-size:12px;color:#a09890;text-decoration:none;background:none;border:none;cursor:pointer;margin-left:12px;}
        .main{padding:28px;max-width:1200px;margin:0 auto;}
        .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
        .head h1{font-size:20px;font-weight:500;color:#1a1714;}
        .card{background:#fff;border:0.5px solid #e0dbd4;border-radius:12px;overflow:hidden;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a09890;font-weight:500;padding:12px 14px;border-bottom:0.5px solid #e0dbd4;}
        td{padding:14px;border-bottom:0.5px solid #f0ece8;vertical-align:middle;}
        tr:last-child td{border-bottom:none;}
        .t-title{font-weight:500;color:#1a1714;}
        .t-sub{font-size:12px;color:#a09890;margin-top:2px;}
        .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;}
        .pill-published{background:#eaf3e2;color:#3b6d11;}
        .pill-draft{background:#f1efe8;color:#7a6f68;}
        .pill-cancelled{background:#fcebeb;color:#a32d2d;}
        .pill-invite{background:#f0e9fa;color:#6b3fa0;}
        .pill-confirmed{background:#eaf3e2;color:#3b6d11;}
        .pill-refunded,.pill-cancelled2{background:#fcebeb;color:#a32d2d;}
        .bar{height:4px;background:#f0ece8;border-radius:2px;margin-top:6px;width:120px;}
        .bar span{display:block;height:100%;background:#3a3330;border-radius:2px;}
        .btn{padding:8px 14px;border:0.5px solid #d0cbc4;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;background:#fff;color:#3a3330;white-space:nowrap;}
        .btn:hover{background:#f5f2ee;}
        .btn-dark{background:#3a3330;color:#fff;border-color:#3a3330;}
        .btn-dark:hover{background:#1a1714;}
        .btn-red{color:#c0392b;border-color:#f5c6c6;}
        .btn:disabled{opacity:.5;cursor:not-allowed;}
        .actions{display:flex;gap:6px;flex-wrap:wrap;}
        .empty{text-align:center;padding:60px 20px;color:#a09890;}
        /* Modal / drawer */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150;display:none;}
        .drawer{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:100vw;background:#fff;z-index:160;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
        .drawer.open{transform:translateX(0);}
        .drawer-head{padding:18px 24px;border-bottom:0.5px solid #e0dbd4;display:flex;align-items:center;justify-content:space-between;gap:12px;}
        .drawer-head h2{font-size:16px;font-weight:500;}
        .drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
        .drawer-foot{padding:14px 24px;border-top:0.5px solid #e0dbd4;display:flex;gap:10px;align-items:center;}
        .x{background:none;border:none;font-size:20px;cursor:pointer;color:#a09890;}
        .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
        .f{grid-column:span 6;}
        .f3{grid-column:span 3;}.f2{grid-column:span 2;}
        .f label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a09890;margin-bottom:5px;}
        .f label small{text-transform:none;letter-spacing:0;color:#c0b8b0;}
        .f input,.f select,.f textarea{width:100%;padding:9px 11px;border:0.5px solid #d0cbc4;border-radius:8px;font-size:13px;font-family:inherit;background:#faf8f5;color:#3a3330;}
        .f textarea{min-height:90px;resize:vertical;line-height:1.5;}
        .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:#3a3330;}
        .sec{grid-column:span 6;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a09890;border-top:0.5px solid #f0ece8;padding-top:14px;margin-top:6px;}
        .cover-prev{width:100%;aspect-ratio:16/9;border-radius:8px;background:#f5f2ee center/cover no-repeat;margin-top:8px;}
        .hint{font-size:12px;color:#8a7f76;line-height:1.5;}
        .status{font-size:12px;}
        .status.err{color:#c0392b;}.status.ok{color:#27ae60;}
        .stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
        .stat{background:#faf8f5;border-radius:8px;padding:10px 14px;min-width:110px;}
        .stat b{display:block;font-size:18px;font-weight:500;color:#1a1714;}
        .stat span{font-size:11px;color:#a09890;}
        .linkbox{display:flex;gap:6px;margin-bottom:16px;}
        .linkbox input{flex:1;padding:9px 11px;border:0.5px solid #d0cbc4;border-radius:8px;font-size:12px;font-family:monospace;background:#faf8f5;}
        .guest td{padding:10px 8px;font-size:13px;}
        .guest .muted{font-size:11px;color:#a09890;}
        .checked{color:#27ae60;font-weight:500;}
        details.addg{background:#faf8f5;border-radius:8px;padding:12px 14px;margin-bottom:16px;}
        details.addg summary{cursor:pointer;font-size:13px;font-weight:500;}
        @media(max-width:760px){.f3,.f2{grid-column:span 6;}.hide-m{display:none;}.main{padding:16px;}}
    </style>
</head>
<body>

<div id="lock">
    <div class="lock-card">
        <div class="lock-wordmark">The Ritual Co.</div>
        <div class="lock-title">Events</div>
        <input class="lock-input" type="password" id="lock-pass" placeholder="Admin password"/>
        <button class="lock-btn" onclick="unlock()">Enter</button>
        <div class="lock-err" id="lock-err">Incorrect password</div>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="topbar-left"><div class="topbar-brand">The Ritual Co.</div><div class="topbar-title">Events</div></div>
        <div><a href="/admin/orders.html">Orders</a><a href="/admin/results.html">Results</a><a href="/events" target="_blank">View site</a><button class="logout-btn" onclick="logout()">Sign out</button></div>
    </div>
    <div class="main">
        <div class="head">
            <h1>Events</h1>
            <button class="btn btn-dark" onclick="openEditor()">+ New event</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Event</th><th class="hide-m">When</th><th>Type</th><th>Booked</th><th class="hide-m">Revenue</th><th>Status</th><th></th></tr></thead>
                <tbody id="ev-tbody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawers()"></div>

<!-- Event editor -->
<div class="drawer" id="editor">
    <div class="drawer-head"><h2 id="ed-title">New event</h2><button class="x" onclick="closeDrawers()">×</button></div>
    <div class="drawer-body">
        <div class="grid">
            <div class="f"><label>Title</label><input id="e-title" placeholder="Sunday Pilates Social"/></div>
            <div class="f"><label>Subtitle <small>(one line under the title)</small></label><input id="e-subtitle" placeholder="A slow mat flow, coffee and conversation"/></div>
            <div class="f f3"><label>Starts</label><input id="e-start" type="datetime-local"/></div>
            <div class="f f3"><label>Ends <small>(optional)</small></label><input id="e-end" type="datetime-local"/></div>

            <div class="sec">Venue</div>
            <div class="f f3"><label>Venue name</label><input id="e-venue" placeholder="The 11:11 Spacce"/></div>
            <div class="f f3"><label>Google Maps link <small>(optional)</small></label><input id="e-map" placeholder="https://maps.app.goo.gl/…"/></div>
            <div class="f"><label>Address</label><input id="e-address" placeholder="Street, area, city"/></div>

            <div class="sec">Tickets</div>
            <div class="f f2"><label>Who can book</label>
                <select id="e-access" onchange="accessChange()"><option value="public">Public (listed)</option><option value="invite">Invite only (hidden)</option></select></div>
            <div class="f f2"><label>Price per spot (₹) <small>0 = free RSVP</small></label><input id="e-price" type="number" min="0" value="0"/></div>
            <div class="f f2"><label>Total spots</label><input id="e-capacity" type="number" min="1" value="20"/></div>
            <div class="f f2"><label>Max spots per booking</label><input id="e-max" type="number" min="1" max="10" value="4"/></div>
            <div class="f f2" id="e-code-wrap" style="display:none;"><label>Invite code <small>(auto if empty)</small></label><input id="e-code" placeholder="e.g. ritual-vip"/></div>
            <div class="f6 f hint" id="e-access-hint">Shown on /events and anyone can book.</div>

            <div class="sec">Page</div>
            <div class="f"><label>Cover image <small>(/images/… path or full URL)</small></label><input id="e-cover" placeholder="/images/yoga-mat-pink-lifestyle.webp" oninput="coverPrev()"/><div class="cover-prev" id="e-cover-prev"></div></div>
            <div class="f"><label>Description</label><textarea id="e-desc" placeholder="What the session is, who it's for, what to wear…"></textarea></div>
            <div class="f"><label>What's included <small>(one per line)</small></label><textarea id="e-includes" placeholder="60-min Pilates mat class&#10;Ritual Mat to use during class&#10;Coffee & a take-home gift"></textarea></div>
            <div class="f f3"><label>Status</label>
                <select id="e-status"><option value="draft">Draft (hidden)</option><option value="published">Published (live)</option><option value="cancelled">Cancelled</option></select></div>
            <div class="f f3" id="e-slug-wrap"><label>Page address <small>(auto if empty)</small></label><input id="e-slug" placeholder="sunday-pilates-15-nov"/></div>
        </div>
    </div>
    <div class="drawer-foot">
        <button class="btn btn-dark" id="ed-save" onclick="saveEvent()">Save event</button>
        <button class="btn" onclick="closeDrawers()">Cancel</button>
        <span class="status" id="ed-status"></span>
    </div>
</div>

<!-- Guests -->
<div class="drawer" id="guests">
    <div class="drawer-head"><h2 id="g-title">Guests</h2><button class="x" onclick="closeDrawers()">×</button></div>
    <div class="drawer-body" id="g-body"></div>
</div>

<script>
    let SESSION_TOKEN = null, EVENTS = [], EDIT_ID = null, GUEST_EVENT = null, BOOKINGS = [];
    const SITE = location.origin;
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const rupees = n => "₹" + Number(n || 0).toLocaleString("en-IN");
    const istInput = iso => iso ? new Date(iso).toLocaleString("sv-SE", { timeZone: "Asia/Kolkata" }).replace(" ", "T").slice(0, 16) : "";
    const fromInput = v => v ? v + ":00+05:30" : null;
    const when = iso => new Date(iso).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });
    const linkFor = e => `${SITE}/events/${e.slug}` + (e.access === "invite" && e.invite_code ? `?invite=${encodeURIComponent(e.invite_code)}` : "");

    async function api(payload) {
        const res = await fetch("/.netlify/functions/events-admin", {
            method: "POST", headers: { "Content-Type": "application/json", "x-admin-token": SESSION_TOKEN }, body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { logout(); throw new Error("Session expired"); }
        if (!res.ok) { const e = new Error(data.error || "HTTP " + res.status); e.data = data; throw e; }
        return data;
    }

    // ── Auth (same session as /admin/orders) ──
    async function unlock() {
        const pass = document.getElementById("lock-pass").value;
        if (!pass) return;
        const res = await fetch("/.netlify/functions/admin-auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pass }) });
        if (!res.ok) { document.getElementById("lock-err").style.display = "block"; return; }
        const { token } = await res.json();
        SESSION_TOKEN = token; sessionStorage.setItem("rc_admin_token", token); start();
    }
    function logout() { sessionStorage.removeItem("rc_admin_token"); location.reload(); }
    function start() {
        document.getElementById("lock").style.display = "none";
        document.getElementById("app").style.display = "block";
        load();
    }
    document.getElementById("lock-pass").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    (function () {
        const saved = sessionStorage.getItem("rc_admin_token");
        if (saved && Date.now() < parseInt(saved.split(".")[0])) { SESSION_TOKEN = saved; start(); }
    })();

    // ── List ──
    async function load() {
        try {
            EVENTS = (await api({ action: "list" })).events;
            render();
        } catch (e) {
            document.getElementById("ev-tbody").innerHTML = `<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`;
        }
    }
    function render() {
        const tb = document.getElementById("ev-tbody");
        if (!EVENTS.length) { tb.innerHTML = `<tr><td colspan="7" class="empty">No events yet. Click “+ New event” to create your first one.</td></tr>`; return; }
        tb.innerHTML = EVENTS.map(e => {
            const pct = Math.min(100, Math.round(e.stats.tickets / e.capacity * 100));
            const past = new Date(e.starts_at) < new Date();
            const type = (e.access === "invite" ? `<span class="pill pill-invite">Invite only</span> ` : "") + (e.price ? rupees(e.price) : "Free");
            return `<tr>
              <td><div class="t-title">${esc(e.title)}</div><div class="t-sub">/events/${esc(e.slug)}</div></td>
              <td class="hide-m">${esc(when(e.starts_at))}${past ? ' <span class="t-sub">(past)</span>' : ""}</td>
              <td>${type}</td>
              <td>${e.stats.tickets} / ${e.capacity}${e.stats.checked_in ? ` <span class="t-sub">· ${e.stats.checked_in} in</span>` : ""}<div class="bar"><span style="width:${pct}%"></span></div></td>
              <td class="hide-m">${e.stats.revenue ? rupees(e.stats.revenue) : "—"}</td>
              <td><span class="pill pill-${e.status}">${e.status}</span></td>
              <td><div class="actions">
                <button class="btn btn-dark" onclick="openGuests('${e.id}')">Guests</button>
                <button class="btn" onclick="openEditor('${e.id}')">Edit</button>
                <button class="btn" onclick="copyLink('${e.id}', this)">Copy link</button>
              </div></td></tr>`;
        }).join("");
    }
    function copyLink(id, btn) {
        const e = EVENTS.find(x => x.id === id);
        navigator.clipboard.writeText(linkFor(e)).then(() => { const t = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = t, 1500); });
    }

    // ── Editor ──
    const F = { title: "e-title", subtitle: "e-subtitle", venue_name: "e-venue", venue_address: "e-address", map_url: "e-map",
        access: "e-access", price: "e-price", capacity: "e-capacity", max_per_booking: "e-max", invite_code: "e-code",
        cover_image: "e-cover", description: "e-desc", includes: "e-includes", status: "e-status", slug: "e-slug" };
    function openEditor(id) {
        EDIT_ID = id || null;
        const e = EVENTS.find(x => x.id === id) || { access: "public", price: 0, capacity: 20, max_per_booking: 4, status: "draft" };
        Object.entries(F).forEach(([k, el]) => document.getElementById(el).value = e[k] ?? "");
        document.getElementById("e-start").value = istInput(e.starts_at);
        document.getElementById("e-end").value = istInput(e.ends_at);
        document.getElementById("e-slug").disabled = !!id;
        document.getElementById("ed-title").textContent = id ? "Edit event" : "New event";
        document.getElementById("ed-status").textContent = "";
        accessChange(); coverPrev();
        show("editor");
    }
    function accessChange() {
        const inv = document.getElementById("e-access").value === "invite";
        document.getElementById("e-code-wrap").style.display = inv ? "" : "none";
        document.getElementById("e-access-hint").textContent = inv
            ? "Hidden from /events. Only people with the invite link can book. You can also add guests yourself from the guest list."
            : "Shown on /events and anyone can book.";
    }
    function coverPrev() {
        const v = document.getElementById("e-cover").value.trim();
        document.getElementById("e-cover-prev").style.backgroundImage = v ? `url("${v.replace(/"/g, "")}")` : "none";
    }
    async function saveEvent() {
        const st = document.getElementById("ed-status"), btn = document.getElementById("ed-save");
        const ev = {}; Object.entries(F).forEach(([k, el]) => ev[k] = document.getElementById(el).value.trim());
        ev.starts_at = fromInput(document.getElementById("e-start").value);
        ev.ends_at = fromInput(document.getElementById("e-end").value);
        if (EDIT_ID) { ev.id = EDIT_ID; delete ev.slug; }
        if (!ev.title || !ev.starts_at) { st.textContent = "Title and start time are required."; st.className = "status err"; return; }
        btn.disabled = true; st.textContent = "Saving…"; st.className = "status";
        try {
            const { event } = await api({ action: "save", event: ev });
            st.textContent = event.status === "published" ? "Saved · live at /events/" + event.slug : "Saved as " + event.status;
            st.className = "status ok";
            await load();
            EDIT_ID = event.id;
            document.getElementById("e-slug").value = event.slug; document.getElementById("e-slug").disabled = true;
            document.getElementById("e-code").value = event.invite_code || "";
        } catch (e) { st.textContent = e.message; st.className = "status err"; }
        btn.disabled = false;
    }

    // ── Guests ──
    async function openGuests(id) {
        GUEST_EVENT = EVENTS.find(x => x.id === id);
        document.getElementById("g-title").textContent = GUEST_EVENT.title;
        document.getElementById("g-body").innerHTML = '<p class="hint">Loading…</p>';
        show("guests");
        await loadGuests();
    }
    async function loadGuests() {
        try { BOOKINGS = (await api({ action: "bookings", event_id: GUEST_EVENT.id })).bookings; renderGuests(); }
        catch (e) { document.getElementById("g-body").innerHTML = `<p class="status err">${esc(e.message)}</p>`; }
    }
    function renderGuests() {
        const e = GUEST_EVENT, conf = BOOKINGS.filter(b => b.status === "confirmed");
        const tickets = conf.reduce((n, b) => n + b.qty, 0), inn = conf.filter(b => b.checked_in_at).reduce((n, b) => n + b.qty, 0);
        const revenue = conf.reduce((n, b) => n + b.amount_paise, 0) / 100;
        document.getElementById("g-body").innerHTML = `
          <div class="stats">
            <div class="stat"><b>${tickets} / ${e.capacity}</b><span>spots booked</span></div>
            <div class="stat"><b>${inn}</b><span>checked in</span></div>
            <div class="stat"><b>${revenue ? rupees(revenue) : "—"}</b><span>revenue</span></div>
          </div>
          <div class="linkbox"><input readonly value="${esc(linkFor(e))}" onclick="this.select()"/><button class="btn" onclick="copyLink('${e.id}', this)">Copy</button></div>
          <details class="addg"><summary>+ Add a guest yourself ${e.access === "invite" ? "(creators, friends)" : ""}</summary>
            <div class="grid" style="margin-top:12px;">
              <div class="f f3"><label>Name</label><input id="ag-name"/></div>
              <div class="f f3"><label>Email</label><input id="ag-email" type="email"/></div>
              <div class="f f2"><label>Phone</label><input id="ag-phone"/></div>
              <div class="f f2"><label>Instagram</label><input id="ag-ig" placeholder="@handle"/></div>
              <div class="f f2"><label>Spots</label><input id="ag-qty" type="number" min="1" value="1"/></div>
              <div class="f"><label style="text-transform:none;letter-spacing:0;font-size:12px;color:#5a4f48;"><input id="ag-notify" type="checkbox" checked style="width:auto;margin-right:6px;"/>Email them the confirmation</label></div>
              <div class="f"><button class="btn btn-dark" onclick="addGuest(this)">Add guest</button> <span class="status" id="ag-status"></span></div>
            </div>
          </details>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span class="hint">${BOOKINGS.length} booking${BOOKINGS.length === 1 ? "" : "s"}</span>
            ${BOOKINGS.length ? `<button class="btn" onclick="downloadCsv()">Download CSV</button>` : ""}
          </div>
          ${BOOKINGS.length ? `<table class="guest"><tbody>${BOOKINGS.map(guestRow).join("")}</tbody></table>` : '<p class="empty">No bookings yet.</p>'}`;
    }
    function guestRow(b) {
        const confirmed = b.status === "confirmed";
        return `<tr>
          <td><div class="t-title">${esc(b.name)}${b.qty > 1 ? ` <span class="t-sub">× ${b.qty}</span>` : ""}</div>
              <div class="muted">${esc(b.email)}${b.phone ? " · " + esc(b.phone) : ""}${b.instagram ? " · @" + esc(b.instagram) : ""}</div>
              <div class="muted">${b.amount_paise ? rupees(b.amount_paise / 100) + " paid" : (b.source === "admin" ? "added by you" : b.source === "invite" ? "invite" : "free RSVP")}</div></td>
          <td>${confirmed ? "" : `<span class="pill pill-${b.status === "refunded" ? "refunded" : "cancelled2"}">${b.status}</span>`}</td>
          <td style="text-align:right;"><div class="actions" style="justify-content:flex-end;">
            ${confirmed ? (b.checked_in_at
                ? `<button class="btn" onclick="checkin('${b.id}', true)"><span class="checked">✓ In</span></button>`
                : `<button class="btn btn-dark" onclick="checkin('${b.id}')">Check in</button>`) : ""}
            ${confirmed ? `<button class="btn btn-red" onclick="cancelBooking('${b.id}')">${b.amount_paise ? "Refund" : "Remove"}</button>` : ""}
          </div></td></tr>`;
    }
    async function checkin(id, undo) {
        try { const { booking } = await api({ action: "checkin", booking_id: id, undo: !!undo }); Object.assign(BOOKINGS.find(b => b.id === id), booking); renderGuests(); load(); }
        catch (e) { alert(e.message); }
    }
    async function cancelBooking(id) {
        const b = BOOKINGS.find(x => x.id === id);
        const paid = b.amount_paise > 0;
        if (!confirm(paid ? `Cancel ${b.name}'s booking and refund ${rupees(b.amount_paise / 100)}? They'll get an email.` : `Remove ${b.name} from the guest list? They'll get an email.`)) return;
        try {
            await api({ action: "cancel", booking_id: id });
        } catch (e) {
            if (e.data && e.data.outside_window) {
                const choice = prompt(e.message + "\n\nType REFUND to refund anyway, or KEEP to cancel without a refund. Leave empty to do nothing.");
                if (!choice) return;
                const c = choice.trim().toUpperCase();
                if (c === "REFUND") await api({ action: "cancel", booking_id: id, force: true }).catch(x => alert(x.message));
                else if (c === "KEEP") await api({ action: "cancel", booking_id: id, refund: false }).catch(x => alert(x.message));
                else return;
            } else { alert(e.message); return; }
        }
        await loadGuests(); load();
    }
    async function addGuest(btn) {
        const st = document.getElementById("ag-status");
        btn.disabled = true; st.textContent = "Adding…"; st.className = "status";
        try {
            await api({ action: "add_guest", event_id: GUEST_EVENT.id,
                name: document.getElementById("ag-name").value, email: document.getElementById("ag-email").value,
                phone: document.getElementById("ag-phone").value, instagram: document.getElementById("ag-ig").value,
                qty: Number(document.getElementById("ag-qty").value) || 1, notify: document.getElementById("ag-notify").checked });
            await loadGuests(); load();
        } catch (e) { st.textContent = e.message; st.className = "status err"; btn.disabled = false; }
    }
    function downloadCsv() {
        const cols = ["name", "email", "phone", "instagram", "qty", "paid", "status", "source", "checked_in", "booked_at"];
        const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
        const rows = BOOKINGS.map(b => [b.name, b.email, b.phone, b.instagram ? "@" + b.instagram : "", b.qty, b.amount_paise / 100, b.status, b.source,
            b.checked_in_at ? "yes" : "", new Date(b.created_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" })].map(q).join(","));
        const blob = new Blob([[cols.join(","), ...rows].join("\n")], { type: "text/csv" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = GUEST_EVENT.slug + "-guests.csv"; a.click();
    }

    // ── Drawers ──
    function show(id) { document.getElementById("overlay").style.display = "block"; document.getElementById(id).classList.add("open"); }
    function closeDrawers() {
        document.getElementById("overlay").style.display = "none";
        document.querySelectorAll(".drawer").forEach(d => d.classList.remove("open"));
    }
</script>
</body>
