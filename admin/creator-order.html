<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Creator Gift Order — The Ritual Co. (Admin)</title>
    <meta name="robots" content="noindex, nofollow"/>
    <link rel="stylesheet" href="/css/global.css"/>
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f4ef;color:#1a1a18;max-width:640px;margin:0 auto;padding:40px 20px;}
        h1{font-size:22px;font-weight:600;margin-bottom:4px;}
        p.sub{color:#6b6257;font-size:13px;margin-bottom:28px;}
        label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6257;margin:16px 0 6px;}
        input, select{width:100%;padding:10px 12px;border:1px solid #e5e0d8;border-radius:6px;font-size:14px;background:#fff;}
        .item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #ece8df;}
        .item-row label{margin-top:0;}
        button{cursor:pointer;}
        #add-item{background:none;border:1px dashed #c9b99a;border-radius:6px;padding:8px 14px;font-size:12px;color:#6b6257;margin-top:6px;}
        #submit-btn{width:100%;background:#1a1a18;color:#fff;border:none;padding:14px;border-radius:6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:28px;}
        #submit-btn:disabled{opacity:.5;cursor:not-allowed;}
        #status-msg{margin-top:16px;font-size:13px;}
        #gate{max-width:320px;margin:80px auto;text-align:center;}
        #gate input{margin-bottom:10px;}
        .source{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
        .source label{margin:0;display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:#1a1a18;border:1px solid #e5e0d8;border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer;}
        .source label small{display:block;font-weight:400;color:#8a8079;font-size:11px;margin-top:2px;}
        .source input{width:auto;margin-top:3px;}
        .source label:has(input:checked){border-color:#1a1a18;}
        #event-wrap{display:none;}
        .remove-item{background:none;border:none;color:#a04040;font-size:18px;line-height:1;padding:8px;}
    </style>
</head>
<body>

<div id="gate">
    <h1>Admin Access</h1>
    <input type="password" id="secret-input" placeholder="Enter admin key"/>
    <button id="gate-btn" style="width:100%;background:#1a1a18;color:#fff;border:none;padding:12px;border-radius:6px;">Unlock</button>
</div>

<div id="form-wrap" style="display:none;">
    <h1 id="page-title">Creator / Collaboration Gift Order</h1>
    <p class="sub" id="page-sub">Places a ₹0 order — decrements real inventory, shows in the orders dashboard and morning briefing, no payment collected.</p>

    <label>Stock comes from</label>
    <div class="source">
        <label><input type="radio" name="source" value="website" checked/><span>Website stock<small>Creator or collab gift. Takes it off the site.</small></span></label>
        <label><input type="radio" name="source" value="event_pool"/><span>Event pool<small>Shipping event stock, e.g. to a venue. Website stock untouched.</small></span></label>
    </div>

    <div id="event-wrap">
        <label for="event_name">Event</label>
        <input id="event_name" list="event-names" placeholder="e.g. Aqua Pilates · Bastian"/>
        <datalist id="event-names"></datalist>
    </div>

    <label for="creator_name" id="name-label">Creator name</label>
    <input id="creator_name" required/>

    <label for="creator_handle">Instagram handle (optional)</label>
    <input id="creator_handle" placeholder="@handle"/>

    <label for="email">Email (optional)</label>
    <input id="email" type="email"/>

    <label for="phone">Phone (optional)</label>
    <input id="phone"/>

    <label for="address">Shipping address</label>
    <input id="address" required/>

    <label for="landmark">Landmark (optional)</label>
    <input id="landmark"/>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div><label for="city">City</label><input id="city"/></div>
        <div><label for="state">State</label><input id="state"/></div>
        <div><label for="pincode">Pincode</label><input id="pincode"/></div>
    </div>

    <h2 style="font-size:14px;margin-top:28px;">Items</h2>
    <div id="items-container"></div>
    <button id="add-item" type="button">+ Add another item</button>

    <button id="submit-btn">Send Gift Order</button>
    <p id="status-msg"></p>
</div>

<script>
    // Every giftable product (must match netlify/functions/shared/product-map.js).
    // Colours + stock are refreshed from live inventory on load (see loadStock);
    // this list is the fallback if that request fails.
    const PRODUCTS = [
        { id: "yoga-mat-5mm",      name: "The Ritual Mat",         colors: ["Cream","Pink","Black","Coffee"] },
        { id: "ankle-weights-2lb", name: "The Ritual Cuffs (ankle weights)", colors: ["Cream","Pink","Black","Coffee"] },
        { id: "grip-socks",        name: "The Ritual Grip Socks",  colors: ["Cream","Pink","Coffee"] },
        { id: "pilates-ball",      name: "The Ritual Ball",        colors: ["Cream","Pink","Black","Coffee"] },
        { id: "pilates-ring",      name: "The Ritual Ring",        colors: ["Cream","Pink","Black","Coffee"] },
        { id: "yoga-belt",         name: "The Ritual Belt",        colors: ["Cream","Black","Coffee"] },
        { id: "yoga-block",        name: "The Ritual Block",       colors: ["Cream","Pink","Black","Coffee"] },
        { id: "capsule-1kg",       name: "Capsule Dumbbells 1kg",  colors: ["Cream","Pink","Black","Coffee"] },
        { id: "capsule-2kg",       name: "Capsule Dumbbells 2kg",  colors: ["Cream","Pink","Black","Coffee"] },
    ];
    const SHADE = { Cream: "Vanilla Cream", Pink: "Strawberry Milk", Black: "Onyx Black", Coffee: "Oat Latte" };
    let STOCK = null; // { productId: { Color: units } } from live inventory
    let POOL = null;  // { productId: { Color: units } } from the event pool
    const source = () => document.querySelector('input[name="source"]:checked').value;
    const counts = () => source() === "event_pool" ? POOL : STOCK;

    async function loadStock() {
        try {
            const res = await fetch("/.netlify/functions/get-availability", { cache: "no-store" });
            if (!res.ok) throw new Error(res.status);
            const data = await res.json();
            STOCK = {};
            PRODUCTS.forEach(p => {
                const cols = (data[p.id] && data[p.id].colors) || {};
                const live = Object.values(cols).map(c => c.color).filter(Boolean);
                if (live.length) {
                    const order = ["Cream","Pink","Black","Coffee"];
                    p.colors = live.sort((a, b) => order.indexOf(a) - order.indexOf(b));
                }
                STOCK[p.id] = {};
                Object.values(cols).forEach(c => { STOCK[p.id][c.color] = Number(c.stock) || 0; });
            });
        } catch (e) {
            console.warn("Live stock unavailable, using fallback product list", e);
            STOCK = null;
        }
    }
    function totalStock(p) {
        const c = counts();
        if (!c) return null;
        if (!c[p.id]) return 0;
        return Object.values(c[p.id]).reduce((a, b) => a + Math.max(0, b), 0);
    }
    function unitsFor(p, color) {
        const c = counts();
        if (!c) return null;
        return Math.max(0, (c[p.id] && c[p.id][color]) || 0);
    }

    async function loadPool() {
        const res = await fetch("/.netlify/functions/create-creator-order", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ secret: secretKey, action: "event_pool" }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Couldn't load the event pool");
        POOL = data.pool || {};
        document.getElementById("event-names").innerHTML = (data.events || []).map(n => `<option value="${n.replace(/"/g, "&quot;")}">`).join("");
    }

    async function onSourceChange() {
        const ev = source() === "event_pool";
        document.getElementById("event-wrap").style.display = ev ? "block" : "none";
        document.getElementById("page-title").textContent = ev ? "Ship Event Stock" : "Creator / Collaboration Gift Order";
        document.getElementById("page-sub").textContent = ev
            ? "Sends opened stock from the event pool (e.g. to a venue). It's logged against the event on the Event stock page, so Return all works as usual. Website stock isn't touched and no email goes out. Ship it from Orders with Delhivery."
            : "Places a ₹0 order — decrements real inventory, shows in the orders dashboard and morning briefing, no payment collected.";
        document.getElementById("name-label").textContent = ev ? "Recipient / venue contact name" : "Creator name";
        document.getElementById("submit-btn").textContent = ev ? "Create Event Shipment" : "Send Gift Order";
        if (ev && POOL === null) {
            try { await loadPool(); }
            catch (e) { alert(e.message); }
        }
        document.querySelectorAll(".item-row").forEach(r => r._refresh && r._refresh());
    }
    document.querySelectorAll('input[name="source"]').forEach(r => r.addEventListener("change", onSourceChange));
    const stockReady = loadStock();

    let secretKey = "";

    document.getElementById("gate-btn").addEventListener("click", () => {
        secretKey = document.getElementById("secret-input").value.trim();
        if (!secretKey) return alert("Enter the admin key.");
        document.getElementById("gate").style.display = "none";
        document.getElementById("form-wrap").style.display = "block";
        addItemRow();
    });

    async function addItemRow() {
        await stockReady;
        const container = document.getElementById("items-container");
        const row = document.createElement("div");
        row.className = "item-row";
        row.innerHTML = `
    <div>
      <label>Product</label>
      <select class="item-product"></select>
    </div>
    <div>
      <label>Colour</label>
      <select class="item-color"></select>
    </div>
    <div>
      <label>Qty</label>
      <input class="item-qty" type="number" min="1" max="10" value="1"/>
    </div>
    <button type="button" class="remove-item" title="Remove">×</button>
  `;
        container.appendChild(row);

        const productSelect = row.querySelector(".item-product");
        const colorSelect = row.querySelector(".item-color");
        function refreshProducts() {
            const keep = productSelect.value;
            const where = source() === "event_pool" ? "in pool" : "in stock";
            productSelect.innerHTML = PRODUCTS.map(p => {
                const t = totalStock(p);
                const label = t === null ? p.name : (t > 0 ? `${p.name} (${t} ${where})` : `${p.name} — none ${where}`);
                return `<option value="${p.id}">${label}</option>`;
            }).join("");
            if (keep) productSelect.value = keep;
        }
        function refreshColors() {
            const prod = PRODUCTS.find(p => p.id === productSelect.value);
            const colors = source() === "event_pool" ? ["Cream","Pink","Black","Coffee"] : prod.colors;
            colorSelect.innerHTML = colors.map(c => {
                const n = unitsFor(prod, c);
                const name = SHADE[c] ? `${SHADE[c]} (${c})` : c;
                if (n === null) return `<option value="${c}">${name}</option>`;
                return n > 0
                    ? `<option value="${c}">${name} — ${n} ${source() === "event_pool" ? "in pool" : "left"}</option>`
                    : `<option value="${c}" disabled>${name} — ${source() === "event_pool" ? "none in pool" : "sold out"}</option>`;
            }).join("");
            const firstOk = Array.from(colorSelect.options).find(o => !o.disabled);
            if (firstOk) colorSelect.value = firstOk.value;
        }
        productSelect.addEventListener("change", refreshColors);
        row._refresh = () => { refreshProducts(); refreshColors(); };
        row._refresh();

        row.querySelector(".remove-item").addEventListener("click", () => row.remove());
    }

    document.getElementById("add-item").addEventListener("click", addItemRow);

    document.getElementById("submit-btn").addEventListener("click", async () => {
        const creator_name = document.getElementById("creator_name").value.trim();
        const address = document.getElementById("address").value.trim();
        const isEvent = source() === "event_pool";
        const event_name = document.getElementById("event_name").value.trim();
        if (!creator_name || !address) {
            return alert((isEvent ? "Recipient name" : "Creator name") + " and shipping address are required.");
        }
        if (isEvent && !event_name) return alert("Which event is this stock going to?");

        const items = Array.from(document.querySelectorAll(".item-row")).map(row => ({
            id:    row.querySelector(".item-product").value,
            color: row.querySelector(".item-color").value,
            qty:   parseInt(row.querySelector(".item-qty").value, 10) || 1,
        }));

        const payload = {
            secret: secretKey,
            creator_name,
            creator_handle: document.getElementById("creator_handle").value.trim(),
            email:          document.getElementById("email").value.trim(),
            phone:          document.getElementById("phone").value.trim(),
            address,
            landmark:       document.getElementById("landmark").value.trim(),
            city:           document.getElementById("city").value.trim(),
            state:          document.getElementById("state").value.trim(),
            pincode:        document.getElementById("pincode").value.trim(),
            items,
            source: source(),
            event_name: isEvent ? event_name : undefined,
        };

        const btn = document.getElementById("submit-btn");
        const statusMsg = document.getElementById("status-msg");
        btn.disabled = true;
        statusMsg.textContent = "Sending...";
        statusMsg.style.color = "#6b6257";

        try {
            const res = await fetch("/.netlify/functions/create-creator-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const result = await res.json();
            if (!res.ok) throw new Error(result.error || "Failed");
            if (result.skipped && result.skipped.length > 0) {
                statusMsg.textContent = `⚠️ Saved ${result.saved_items}/${result.requested_items} items — some were skipped (not in stock or inactive). Check console for details.`;
                statusMsg.style.color = "#a06b04";
                console.warn("Skipped items:", result.skipped);
            } else {
                statusMsg.innerHTML = isEvent
                    ? `✅ Event shipment created for ${event_name} — ${result.saved_items} item(s) taken from the event pool. <a href="/admin/orders.html">Ship it from Orders →</a>`
                    : `✅ Gift order placed — ${result.saved_items} item(s) recorded.`;
                statusMsg.style.color = "#2a6b3a";
                if (isEvent) { POOL = null; await loadPool().catch(() => {}); document.querySelectorAll(".item-row").forEach(r => r._refresh && r._refresh()); }
            }
        } catch (err) {
            statusMsg.textContent = "❌ " + err.message;
            statusMsg.style.color = "#a04040";
        } finally {
            btn.disabled = false;
        }
    });
</script>
<script src="/javascript/admin-nav.js" defer></script>
</body>
</html>
