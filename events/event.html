<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D366Q7R3XB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-D366Q7R3XB');
    </script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="/images/favicon.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Sans:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/global.css"/>
    <link rel="stylesheet" href="/css/navbar.css"/>
    <link rel="stylesheet" href="/css/footer.css"/>
    <link rel="stylesheet" href="/css/cart.css"/>
    <link rel="stylesheet" href="/css/events.css"/>
    <script src="/javascript/meta-pixel.js"></script>
    <title>Event | The Ritual Co.</title>
    <meta name="description" content="Book your spot at a The Ritual Co. event."/>
    <meta property="og:type" content="website"/>
    <meta property="og:image" content="https://theritualco.in/images/yoga-mat-pink-lifestyle.webp"/>
</head>
<body>
<div class="page-wrapper">
    <div id="navbar-placeholder"></div>
    <main class="ev-wrap" id="ev-root"><div class="ev-layout"><div class="ev-skel"></div><div class="ev-skel"></div></div></main>
    <div id="footer-placeholder"></div>
</div>
<script src="/javascript/cart.js"></script>
<script>
    fetch("/partials/navbar.html").then(r => r.text()).then(html => {
        document.getElementById("navbar-placeholder").innerHTML = html;
        ["/javascript/cart-drawer.js", "/javascript/navbar.js"].forEach(src => {
            const s = document.createElement("script"); s.src = src; document.body.appendChild(s);
        });
    });
    fetch("/partials/footer.html").then(r => r.text()).then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
    });
</script>
<script>
(function () {
    var root = document.getElementById("ev-root");
    var slug = decodeURIComponent(location.pathname.replace(/\/+$/, "").split("/").pop() || "");
    var params = new URLSearchParams(location.search);
    var invite = params.get("invite") || "";
    var EV = null;

    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
    var rupees = function (n) { return "₹" + Number(n).toLocaleString("en-IN"); };
    function dateStr(iso) { return new Date(iso).toLocaleDateString("en-IN", { timeZone: "Asia/Kolkata", weekday: "long", day: "numeric", month: "long" }); }
    function timeStr(iso) { return new Date(iso).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit", hour12: true }); }
    function calLink(e) {
        var z = function (d) { return new Date(d).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); };
        var end = e.ends_at || new Date(new Date(e.starts_at).getTime() + 90 * 60000).toISOString();
        return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
            action: "TEMPLATE", text: e.title + " — The Ritual Co.", dates: z(e.starts_at) + "/" + z(end),
            location: [e.venue_name, e.venue_address].filter(Boolean).join(", "), details: location.origin + "/events/" + e.slug
        }).toString();
    }

    function notFound() {
        document.title = "Event not found | The Ritual Co.";
        root.innerHTML = '<p class="ev-eyebrow">Events</p><h1 class="ev-h1">We couldn\'t find that event.</h1>' +
            '<p class="ev-muted">It may have been moved. <a href="/events" style="color:#3a3330;">See all events</a>.</p>';
    }

    var EARLY_LEFT = 0;
    function hasPair(e) { return !!(e.price && e.pair_price && e.pair_price < e.price * 2); }
    function regular(e, q) { return hasPair(e) ? Math.floor(q / 2) * e.pair_price + (q % 2) * e.price : e.price * q; }
    function total(e, q) {
        q = Math.max(1, q || 1);
        var n = Math.min(q, EARLY_LEFT);
        return Math.min(n * e.early_price + (q > n ? regular(e, q - n) : 0), regular(e, q));
    }
    function btnLabel(e, q) { return (q > 1 ? "Book " + q + " spots · " : "Book your spot · ") + rupees(total(e, q)); }

    function bookingBlock(d) {
        var e = d.event;
        if (e.status === "cancelled") return '<div class="ev-closed"><strong>This event has been cancelled.</strong>Everyone booked has been contacted. <a href="/events" style="color:#3a3330;">See other events</a>.</div>';
        if (d.past) return '<div class="ev-closed"><strong>This event has happened.</strong>Thank you to everyone who came. <a href="/events" style="color:#3a3330;">See what\'s next</a>.</div>';
        if (e.ticket_url) return '<a class="ev-btn ev-btn--out" id="ev-out" href="' + esc(e.ticket_url) + '" target="_blank" rel="noopener">Get tickets &#8599;</a>' +
            '<p class="ev-form__note">Tickets are sold by ' + (e.host_name ? esc(e.host_name) : "the organiser") + '. The Ritual Co. is partnering on this event.</p>';
        if (e.host_name) return '<div class="ev-closed"><strong>Registrations are handled by ' + esc(e.host_name) + '.</strong>The Ritual Co. is partnering on this event. Follow <a href="https://instagram.com/theritualco.in" style="color:#3a3330;">@theritualco.in</a> for registration details.</div>';
        if (!d.invited) return '<div class="ev-closed"><strong>By invitation only.</strong>This is a private session. If you\'ve been invited, please open the link from your invitation.</div>';
        if (d.spots_left <= 0) return '<div class="ev-closed"><strong>Fully booked.</strong>Spots sometimes open up. DM us on <a href="https://instagram.com/theritualco.in" style="color:#3a3330;">Instagram</a> to join the waitlist.</div>';
        var max = Math.min(e.max_per_booking || 4, d.spots_left);
        var opts = "";
        for (var i = 1; i <= max; i++) opts += '<option value="' + i + '"' + (i === 1 ? " selected" : "") + '>' + i + (i === 1 ? " spot" : " spots") + (e.price ? " · " + rupees(total(e, i)) : "") + (i === 2 && hasPair(e) && EARLY_LEFT < 2 ? " (pair deal)" : "") + '</option>';
        var note = e.price
            ? "Secure payment via Razorpay. Full refund up to 48 hours before the event."
            : (e.access === "invite" ? "You're on the guest list once you confirm." : "Free to attend. Please only RSVP if you can make it.");
        return '<form class="ev-form" id="ev-form" novalidate>' +
            '<div class="ev-form__grid">' +
            '<input class="span-2" name="name" placeholder="Full name" autocomplete="name" required>' +
            '<input name="email" type="email" placeholder="Email" autocomplete="email" required>' +
            '<input name="phone" type="tel" placeholder="Phone" autocomplete="tel" required>' +
            '<input name="instagram" placeholder="Instagram handle (optional)">' +
            '<select name="qty"' + (max === 1 ? ' style="display:none"' : '') + '>' + opts + '</select>' +
            '</div>' +
            '<button class="ev-btn" type="submit">' + (e.price ? btnLabel(e, 1) : (e.access === "invite" ? "Confirm my spot" : "RSVP")) + '</button>' +
            '<p class="ev-form__err" id="ev-err"></p>' +
            '<p class="ev-form__note">' + note + '</p></form>';
    }

    // ── Photos: swipeable gallery (cover first) + titled photo sections ──
    // Gallery order: photos marked "lead" first, then the cover, then the rest.
    function photos(e) {
        var all = (e.gallery || []).filter(function (g) { return g && g.src; });
        var lead = all.filter(function (g) { return g.lead; });
        var list = lead.concat(e.cover_image ? [{ src: e.cover_image, alt: e.title }] : [], all.filter(function (g) { return !g.lead; }));
        var seen = {};
        return list.filter(function (g) { return seen[g.src] ? false : (seen[g.src] = true); });
    }
    function mediaBlock(e) {
        var list = photos(e);
        if (!list.length) return '<div class="ev-media"></div>';
        return '<div class="ev-media"><div class="ev-slides" id="ev-slides">' +
            list.map(function (g, i) {
                return '<figure class="ev-slide"><img src="' + esc(g.src) + '" alt="' + esc(g.alt || g.title || e.title) + '"' + (i ? ' loading="lazy"' : '') + '>' +
                    (g.title ? '<figcaption>' + esc(g.title) + '</figcaption>' : '') + '</figure>';
            }).join("") + '</div>' +
            (list.length > 1 ? '<div class="ev-thumbs" id="ev-thumbs">' + list.map(function (g, i) {
                return '<button type="button" aria-label="Photo ' + (i + 1) + '"' + (i ? '' : ' class="on"') + '><img src="' + esc(g.src) + '" alt="" loading="lazy"></button>';
            }).join("") + '</div>' : '') + '</div>';
    }
    function wireMedia() {
        var track = document.getElementById("ev-slides"), thumbs = document.getElementById("ev-thumbs");
        if (!track || !thumbs) return;
        var btns = thumbs.querySelectorAll("button");
        btns.forEach(function (b, i) { b.addEventListener("click", function () { track.scrollTo({ left: track.clientWidth * i, behavior: "smooth" }); }); });
        track.addEventListener("scroll", function () {
            var i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
            btns.forEach(function (b, j) { b.classList.toggle("on", i === j); });
        }, { passive: true });
    }
    function sectionsBlock(e) {
        var groups = [], by = {};
        (e.gallery || []).forEach(function (g) {
            if (!g || !g.src || !g.section || !g.title) return;
            if (!by[g.section]) { by[g.section] = []; groups.push(g.section); }
            by[g.section].push(g);
        });
        return groups.map(function (name) {
            var items = by[name];
            return '<p class="ev-section-t">' + esc(name) + '</p><div class="ev-tiles' + (items.length === 1 ? ' is-one' : '') + '">' +
                items.map(function (g) {
                    return '<div class="ev-tile"><img src="' + esc(g.src) + '" alt="' + esc(g.alt || g.title) + '" loading="lazy">' +
                        '<div class="ev-tile__t"><strong>' + esc(g.title) + '</strong>' + (g.text ? '<span>' + esc(g.text) + '</span>' : '') + '</div></div>';
                }).join("") + '</div>';
        }).join("");
    }
    // ── Phone: sticky "Book" bar until the form is on screen ──
    function stickyBar(e, d) {
        if (!d.bookable || !e.price) return "";
        var from = EARLY_LEFT ? e.early_price : e.price;
        return '<div class="ev-sticky" id="ev-sticky"><div><strong>' + rupees(from) + '</strong>' +
            (EARLY_LEFT ? ' <s>' + rupees(e.price) + '</s><span>Early bird &middot; last few spots</span>' : '<span>per spot</span>') +
            '</div><a href="#ev-book">Book now</a></div>';
    }
    function wireSticky() {
        var bar = document.getElementById("ev-sticky"), book = document.getElementById("ev-book");
        if (!bar || !book) return;
        bar.querySelector("a").addEventListener("click", function (ev) {
            ev.preventDefault(); book.scrollIntoView({ behavior: "smooth", block: "start" });
            setTimeout(function () { var n = book.querySelector("input[name=name]"); if (n) n.focus({ preventScroll: true }); }, 500);
        });
        if (!("IntersectionObserver" in window)) return;
        new IntersectionObserver(function (en) { bar.classList.toggle("is-hidden", en[0].isIntersecting); }, { rootMargin: "0px 0px -20% 0px" }).observe(book);
    }

    function wireRemind() {
        var f = document.getElementById("ev-remind");
        if (!f) return;
        f.addEventListener("submit", function (ev) {
            ev.preventDefault();
            var note = document.getElementById("ev-remind-note"), btn = f.querySelector("button");
            var phone = f.rphone.value.replace(/\D/g, "").replace(/^(91|0)(?=\d{10}$)/, "");
            if (!/^[6-9]\d{9}$/.test(phone)) { note.textContent = "Please enter a 10-digit mobile number."; note.style.color = "#b4563a"; return; }
            btn.disabled = true;
            fetch("/.netlify/functions/event-book", { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "remind", slug: EV.slug, name: f.rname.value.trim(), phone: phone }) })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (res) {
                    if (!res.ok) throw new Error(res.j.error || "Couldn't save that. Please try again.");
                    f.innerHTML = '<p class="ev-remind__t"><strong>Done 🤍</strong> We\'ll send you a WhatsApp reminder before ' + (EARLY_LEFT ? "the early bird ends." : "spots run out.") + '</p>';
                    try { gtag("event", "generate_lead", { event_category: "event", event_label: EV.slug }); } catch (x) {}
                    try { if (window.trackMeta) window.trackMeta("Lead", { content_name: EV.title, content_category: "event" }); } catch (x) {}
                })
                .catch(function (e) { btn.disabled = false; note.textContent = e.message; note.style.color = "#b4563a"; });
        });
    }

    function render(d) {
        var e = d.event; EV = e;
        // Meta: ViewContent once, so event-page visitors can be measured and retargeted.
        if (!window.__evViewed) {
            window.__evViewed = true;
            try { if (window.trackMeta) window.trackMeta("ViewContent", { content_name: e.title, content_category: "event", content_ids: ["event-" + e.slug], value: e.early_price || e.price || 0, currency: "INR" }); } catch (x) {}
        }
        EARLY_LEFT = (e.early_price && e.early_price < e.price && d.early_left > 0) ? d.early_left : 0;
        document.title = e.title + " | The Ritual Co. Events";
        // Only show scarcity when it's real: sold out, or 5 or fewer spots left.
        var spots = !e.ticket_url && !e.host_name && e.status === "published" && !d.past && d.spots_left <= 5
            ? '<span class="ev-spots is-low">' + (d.spots_left <= 0 ? "Sold out" : "Only " + d.spots_left + (d.spots_left === 1 ? " spot" : " spots") + " left") + '</span>' : "";
        var where = [esc(e.venue_name), esc(e.venue_address)].filter(Boolean).join("<br>") +
            (e.map_url ? '<br><a href="' + esc(e.map_url) + '" target="_blank" rel="noopener">Open in Maps</a>' : "");
        root.innerHTML =
            '<div class="ev-layout">' +
            mediaBlock(e) +
            '<div>' +
            '<p class="ev-eyebrow">The Ritual Co. &middot; ' + (e.access === "invite" ? "Private event" : (e.ticket_url || e.host_name) ? "Partner event" + (e.host_name ? " with " + esc(e.host_name) : "") : "Event") + '</p>' +
            '<h1 class="ev-h1">' + esc(e.title) + '</h1>' +
            (e.subtitle ? '<p class="ev-lede">' + esc(e.subtitle) + '</p>' : "") +
            '<div class="ev-facts">' +
            '<div class="ev-fact"><span class="ev-fact__k">When</span><span class="ev-fact__v">' + esc(dateStr(e.starts_at)) + '<br>' + esc(timeStr(e.starts_at)) + (e.ends_at ? " – " + esc(timeStr(e.ends_at)) : "") + '</span></div>' +
            (where ? '<div class="ev-fact"><span class="ev-fact__k">Where</span><span class="ev-fact__v">' + where + '</span></div>' : "") +
            '</div>' +
            '<div class="ev-price-row"><span class="ev-price">' + (EARLY_LEFT ? rupees(e.early_price) + ' <s class="ev-was">' + rupees(e.price) + '</s>' : e.price ? rupees(e.price) : ((e.ticket_url || e.host_name) ? "" : e.access === "invite" ? "Guest list" : "Free")) + '</span>' + spots + '</div>' +
            (EARLY_LEFT ? '<p class="ev-pair"><strong>Early bird</strong> &middot; ' + rupees(e.early_price) + ' for the first ' + e.early_spots + ' spots &middot; last few spots left at this price</p>' : "") +
            (hasPair(e) && EARLY_LEFT < 2 ? '<p class="ev-pair">Bring a friend: <strong>2 spots for ' + rupees(e.pair_price) + '</strong> &middot; save ' + rupees(e.price * 2 - e.pair_price) + '</p>' : "") +
            '<div id="ev-book">' + bookingBlock(d) + '</div>' +
            (d.bookable ? '<form class="ev-remind" id="ev-remind" novalidate><p class="ev-remind__t"><strong>Not ready to book?</strong> ' + (EARLY_LEFT ? 'Get a WhatsApp reminder before the early bird ends.' : 'Get a WhatsApp reminder before spots run out.') + '</p>' +
                '<div class="ev-remind__row"><input name="rname" placeholder="First name" autocomplete="given-name"><input name="rphone" type="tel" inputmode="numeric" placeholder="WhatsApp number" autocomplete="tel"><button type="submit">Remind me</button></div>' +
                '<p class="ev-remind__note" id="ev-remind-note">We\'ll only message you about this event.</p></form>' : "") +
            (e.description ? '<p class="ev-section-t">About the session</p><p class="ev-desc">' + esc(e.description) + '</p>' : "") +
            sectionsBlock(e) +
            (e.includes && e.includes.length ? '<p class="ev-section-t">Included</p><ul class="ev-includes">' + e.includes.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + '</ul>' : "") +
            (e.price && !e.ticket_url && !e.host_name ? '<p class="ev-policy">Cancellations: full refund up to 48 hours before the event. After that, you can pass your spot to a friend; just reply to your confirmation email with their name.</p>' : "") +
            '</div></div>' + stickyBar(e, d);
        wireMedia(); wireSticky(); wireRemind();
        var out = document.getElementById("ev-out");
        if (out) out.addEventListener("click", function () {
            try { gtag("event", "partner_ticket_click", { event_category: "event", event_label: EV.slug }); } catch (x) {}
            try { if (window.trackMeta) window.trackMeta("Lead", { content_name: EV.title, content_category: "partner_event" }); } catch (x) {}
        });
        var form = document.getElementById("ev-form");
        if (form) form.addEventListener("submit", submit);
        var qsel = form && form.querySelector("select[name=qty]");
        if (qsel && EV.price) qsel.addEventListener("change", function () {
            form.querySelector(".ev-btn").textContent = btnLabel(EV, Number(qsel.value) || 1);
        });
    }

    function done(e, email, qty, ref, paid) {
        // Meta: a booking is a CompleteRegistration (kept separate from shop Purchases).
        try {
            if (window.trackMeta) window.trackMeta("CompleteRegistration", {
                content_name: e.title, content_category: "event", content_ids: ["event-" + e.slug],
                value: paid || 0, currency: "INR", num_items: qty || 1
            }, ref ? "evt_" + ref : undefined);
        } catch (x) {}
        document.getElementById("ev-book").innerHTML = '<div class="ev-done"><h2>You\'re in.</h2>' +
            '<p>We\'ve sent the details to <strong>' + esc(email) + '</strong>. See you on ' + esc(dateStr(e.starts_at)) + '.</p>' +
            '<a href="' + calLink(e) + '" target="_blank" rel="noopener">Add to calendar</a></div>';
        try { gtag("event", e.price ? "purchase" : "sign_up", { event_category: "event", event_label: e.slug }); } catch (x) {}
    }

    function loadRazorpay() {
        return new Promise(function (ok, fail) {
            if (window.Razorpay) return ok();
            var s = document.createElement("script"); s.src = "https://checkout.razorpay.com/v1/checkout.js";
            s.onload = ok; s.onerror = fail; document.head.appendChild(s);
        });
    }

    function submit(ev) {
        ev.preventDefault();
        var f = ev.target, btn = f.querySelector(".ev-btn"), err = document.getElementById("ev-err");
        var data = { action: "book", slug: EV.slug, invite: invite,
            name: f.name.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(),
            instagram: f.instagram.value.trim(), qty: Number(f.qty.value) || 1 };
        if (!data.name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email) || data.phone.replace(/\D/g, "").length < 10) {
            err.textContent = "Please fill in your name, a valid email and phone number."; return;
        }
        err.textContent = ""; btn.disabled = true; var label = btn.textContent; btn.textContent = "One moment…";
        var reset = function (msg) { btn.disabled = false; btn.textContent = label; if (msg) err.textContent = msg; };

        fetch("/.netlify/functions/event-book", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                if (!res.ok) return reset(res.j.error || "Something went wrong. Please try again.");
                if (res.j.status === "confirmed") return done(EV, data.email, data.qty, res.j.booking_id, 0);
                return loadRazorpay().then(function () {
                    var rzp = new Razorpay({
                        key: res.j.key, amount: res.j.amount, currency: "INR", order_id: res.j.order_id,
                        name: "The Ritual Co.", description: res.j.title,
                        prefill: { name: data.name, email: data.email, contact: data.phone },
                        theme: { color: "#3a3330" },
                        handler: function (p) {
                            btn.textContent = "Confirming…";
                            fetch("/.netlify/functions/event-book", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ action: "verify", razorpay_order_id: p.razorpay_order_id, razorpay_payment_id: p.razorpay_payment_id, razorpay_signature: p.razorpay_signature }) })
                                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                                .then(function (v) { if (v.ok) done(EV, data.email, data.qty, p.razorpay_payment_id, res.j.amount / 100); else reset((v.j.error || "Payment received but not confirmed.") + " Payment ID: " + p.razorpay_payment_id); })
                                .catch(function () { reset("Payment received. If you don't get an email in 10 minutes, contact us with payment ID " + p.razorpay_payment_id); });
                        },
                        modal: { ondismiss: function () { reset(); } }
                    });
                    rzp.open();
                }, function () { reset("Couldn't load the payment window. Please check your connection."); });
            })
            .catch(function () { reset("Something went wrong. Please try again."); });
    }

    if (slug === "index") { location.replace("/events"); return; }
    if (!slug || slug === "event") return notFound();
    fetch("/.netlify/functions/events-public?slug=" + encodeURIComponent(slug) + (invite ? "&invite=" + encodeURIComponent(invite) : ""))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.event) render(d); else notFound(); })
        .catch(notFound);
})();
</script>
</body>
</html>
